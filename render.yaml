services:
  - type: web
    name: aerocrash
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aerocrash-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_FROM_NAME
        value: AeroCrash
      - key: SASPAY_API_URL
        value: https://api.saspay.me/api/v1

databases:
  - name: aerocrash-db
    databaseName: aerocrash
    user: aerocrash
    plan: free
    region: oregon
