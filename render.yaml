services:
  - type: web
    name: aerocrash
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aerocrash-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://rres.onrender.com
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: AeroCrash
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: AeroCrash
      - key: SASPAY_API_URL
        value: https://api.saspay.me/api/v1
      - key: SASPAY_API_KEY
        sync: false
      - key: SASPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: aerocrash-db
    databaseName: aerocrash
    user: aerocrash
    plan: free
    region: oregon
